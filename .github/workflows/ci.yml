name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit / regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify legacy-derived data is in sync
        run: |
          npm run sync:legacy
          git diff --exit-code -- src/domain src/i18n src/test/fixtures
