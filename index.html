<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="AlgoViz" />
    <meta name="theme-color" content="#0a1020" />
    <meta name="description" content="AlgoViz — 数据结构与算法可视化教材：真实 Python Trace、逐帧动画，以及只读 C/C++/Python 参考代码。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AlgoViz · 数据结构与算法可视化教材</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('algolens-theme') || 'system';
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'light' || pref === 'dark' ? pref : (dark ? 'dark' : 'light');
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) { /* private mode: fall back to the markup default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
